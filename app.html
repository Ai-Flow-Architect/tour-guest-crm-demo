<title>ツアー×ゲスト管理デモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* レイアウト: 上に固定の帯（ログイン中の人と画面切替）／左に一覧・右に詳細の2段。スマホでは1段に積む */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --ink:#17282c; --muted:#5b6f73; --line:#d6e1e2;
  --river:#0f6b78; --river-soft:#e1f0f1; --sand:#b9772f; --sand-soft:#f7ecdf;
  --ok:#2c7a4b; --ok-soft:#e3f2e8; --warn:#a3610b; --warn-soft:#fbefd9; --bad:#b3362c; --bad-soft:#fbe4e1;
  --hl:#fff2a8;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a1c; --surface:#16252a; --ink:#e3eeef; --muted:#9db1b4; --line:#2a3f44;
  --river:#5fc0cc; --river-soft:#16363b; --sand:#e0a866; --sand-soft:#3a2c1c;
  --ok:#73c995; --ok-soft:#173826; --warn:#e8b25c; --warn-soft:#3b2d14; --bad:#f08a80; --bad-soft:#3d1c19; --hl:#5a4d10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1c; --surface:#16252a; --ink:#e3eeef; --muted:#9db1b4; --line:#2a3f44;
  --river:#5fc0cc; --river-soft:#16363b; --sand:#e0a866; --sand-soft:#3a2c1c;
  --ok:#73c995; --ok-soft:#173826; --warn:#e8b25c; --warn-soft:#3b2d14; --bad:#f08a80; --bad-soft:#3d1c19; --hl:#5a4d10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--river);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 上の帯 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:6px;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--river-soft);color:var(--river);border-color:var(--river-soft);font-weight:700}
nav.tabs .cnt{display:inline-block;margin-left:6px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:11px;text-align:center}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px}
.demo-note{background:var(--sand-soft);color:var(--ink);font-size:12px}
.demo-note div{max-width:1280px;margin:0 auto;padding-block:6px}

main{max-width:1280px;margin:0 auto;padding-block:18px 48px}
.split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.list-head{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.list-head input,.list-head select{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--bg)}
.list{max-height:72vh;overflow:auto}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px}
.row:hover{background:var(--river-soft)}
.row[aria-selected="true"]{background:var(--river-soft);box-shadow:inset 3px 0 0 var(--river)}
.row .l1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.row .l2{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-weight:400}
.c-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.c-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.c-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.c-river{background:var(--river-soft);color:var(--river);border-color:transparent}
.c-sand{background:var(--sand-soft);color:var(--sand);border-color:transparent}

.detail{padding:20px;min-width:0}
.d-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.d-head h1{font-family:var(--f-display);font-size:26px;font-weight:800;margin:0;line-height:1.25;text-wrap:balance}
.d-head .sub{color:var(--muted);font-size:13px;width:100%}
h2{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kv div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kv dt{font-size:11.5px;color:var(--muted)}
.kv dd{margin:0;font-weight:700}

.ai{border:1px solid var(--river);border-radius:10px;background:var(--river-soft);padding:14px 16px}
.ai .ai-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--river);font-weight:700;margin-bottom:6px}
.ai p{margin:0 0 10px}
.ai-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ai-cols h3{font-size:12.5px;margin:0 0 4px}
.ai ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.ai li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ai li.done span{text-decoration:line-through;color:var(--muted)}
.src{border:0;background:none;color:var(--river);font-size:12px;text-decoration:underline;white-space:nowrap;padding:0}
.ai li label{display:flex;gap:6px;align-items:flex-start}

.thread{display:grid;gap:10px}
.mail{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.mail.out{background:var(--bg)}
.mail .mh{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;font-size:12px;color:var(--muted)}
.mail .mh b{color:var(--ink)}
.mail pre{white-space:pre-wrap;font-family:var(--f-body);margin:6px 0 0;font-size:13.5px}
.mail.flash{box-shadow:0 0 0 3px var(--hl)}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}

.lock{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:8px;padding:9px 12px;font-size:13px}
.btn{border:1px solid var(--river);background:var(--river);color:var(--surface);border-radius:7px;padding:6px 13px;font-weight:700}
.btn.ghost{background:var(--surface);color:var(--river)}
.btn:disabled{opacity:.45;cursor:not-allowed}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.compose-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--muted);font-weight:700;background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
a.link,button.link{color:var(--river);font-weight:700;text-decoration:underline;border:0;background:none;padding:0;text-align:left}

.tour-chips{display:flex;flex-wrap:wrap;gap:8px}
.tour-chip{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);text-align:left;min-width:0}
.tour-chip b{display:block;color:var(--river)}

/* 受信箱 */
.inbox-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.inbox-row:last-child{border-bottom:0}
@media (max-width:760px){.inbox-row{grid-template-columns:minmax(0,1fr) auto}.inbox-row .ib-sub{grid-column:1/-1;order:3}}
.ib-sub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.summary-strip div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.summary-strip b{display:block;font-size:22px;font-family:var(--f-mono)}
.summary-strip span{font-size:12px;color:var(--muted)}

/* ガイド用（スマホ） */
.phone{max-width:400px;margin:0 auto;border:1px solid var(--line);border-radius:22px;background:var(--surface);overflow:hidden}
.phone-top{background:var(--river);color:var(--surface);padding:14px 16px}
.phone-top b{font-family:var(--f-display);font-size:18px}
.phone-body{padding:14px 14px 22px;display:grid;gap:12px}
.g-card{border:1px solid var(--line);border-radius:12px;padding:12px}
.g-card h3{margin:0 0 4px;font-size:15px}
.day{border-left:2px solid var(--river);padding-left:10px;margin-top:8px}
.day b{font-size:12.5px;color:var(--river)}
.day ol{margin:4px 0 0;padding:0;list-style:none;font-size:13px;display:grid;gap:2px}
.day li{display:grid;grid-template-columns:44px 1fr;gap:6px}
.gp{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;font-size:13px}
.gp .need{color:var(--bad);font-weight:700}
.guide-layout{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.guide-layout{grid-template-columns:minmax(0,1fr)}}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.explain h3{font-family:var(--f-display);margin:0 0 6px;font-size:17px}
.explain ul{margin:6px 0 0;padding-left:18px}
.muted{color:var(--muted)}
.empty{padding:28px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in wrap">
    <div class="brand"><b>ツアー×ゲスト管理</b><small>クラウド型 管理画面（デモ）</small></div>

</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

   ${!gs.length&&!t.ext?'<p class="muted">まだ参加ゲストはいません。</p>':""}
   <h2>ホテル・宿泊手配</h2>
   ${t.hotels.length?`<div class="tbl-wrap"><table><thead><tr><th>泊</th><th>宿</th><th>手配状況</th></tr></thead><tbody>${t.hotels.map(h=>`<tr><td class="mono">${h.night}泊目</td><td>${esc(h.n)}</td><td><span class="chip ${h.s==="手配済"?"c-ok":"c-warn"}">${h.s}</span></td></tr>`).join("")}</tbody></table></div>`:'<p class="muted">日帰りのため宿泊なし</p>'}
   <h2>アクティビティ・予約状況</h2>
   <div class="tbl-wrap"><table><thead><tr><th>日</th><th>時刻</th><th>内容</th><th>予約</th></tr></thead><tbody>${t.acts.map(a=>`<tr><td class="mono">${a.d}日目</td><td class="mono">${a.t}</td><td>${esc(a.n)}</td><td><span class="chip ${a.s==="予約済"?"c-ok":a.s==="仮押さえ"?"c-warn":"c-bad"}">${a.s}</span></td></tr>`).join("")}</tbody></table></div>
   <h2>行程</h2>
   ${t.it.map((d,i)=>`<div class="day"><b>${i+1}日目　<span class="mono">${fmtDate(addDays(t.start,i))}</span></b><ol>${d.map(x=>`<li><span class="mono">${x[0]}</span><span>${esc(x[1])}</span></li>`).join("")}</ol></div>`).join("")}`;
}

/* ---------- 画面：共通メール ---------- */
function viewInbox(){
  const rows=GUESTS.map(g=>({g,m:g.emails[g.emails.length-1]})).sort((a,b)=>b.m.at.localeCompare(a.m.at));
  const open=GUESTS.filter(unanswered);
  const late=open.filter(g=>hoursSince(lastIn(g).at)>=24&&!g.handler);
  return `<div class="summary-strip">
     <div><b>${open.length}</b><span>返信待ちのゲスト</span></div>
     <div><b style="color:var(--bad)">${late.length}</b><span>24時間以上・担当なし（返信漏れの恐れ）</span></div>
     <div><b>${GUESTS.filter(g=>g.handler&&unanswered(g)).length}</b><span>担当者が対応中</span></div>
     <div><b>${GUESTS.reduce((s,g)=>s+g.ai.todos.filter(t=>!t.done).length,0)}</b><span>AIが抽出した未対応事項</span></div>
   </div>
   <section class="panel" aria-label="共通メールの受信箱">
     ${rows.map(({g,m})=>{const h=hoursSince(m.at);const needs=m.dir==="in";return `
     <div class="inbox-row">
       <div><button type="button" class="link" data-guest="${g.id}">${esc(g.name)}</button><div class="mono muted" style="font-size:12px">${m.at}${needs?`（${h}時間前）`:""}</div></div>
       <div class="ib-sub">${needs?"":"↩ "}${esc(m.subj)} — ${esc(g.ai.summary)}</div>
       <div>${needs?(g.handler?`<span class="chip c-river">対応中：${esc(g.handler)}</span>`:`<span class="chip c-bad">${h>=24?"返信漏れ注意":"未対応"}</span>`):'<span class="chip c-ok">返信済</span>'}</div>
       <div class="mono muted" style="font-size:12px">${g.ai.todos.filter(t=>!t.done).length}件</div>
     </div>`}).join("")}
   </section>
   <p class="muted" style="font-size:12px">本番では Google Workspace の共通アドレスに届いたメールを自動で取り込み、送信元のメールアドレスでゲストへひも付けます。</p>`;
}

/* ---------- 画面：ガイド ---------- */
function viewGuide(){
  const guideName = me().role==="guide"?me().name:"田中";
  const mine=TOURS.filter(t=>t.guide===guideName&&t.start>=TODAY).slice(0,3);
  return `<div class="guide-layout">
   <div class="phone" aria-label="ガイドのスマホ画面">
     <div class="phone-top"><b>${esc(guideName)}さんの担当ツアー</b><div style="font-size:12px">本日 ${fmtDate(TODAY)}・担当分だけ表示</div></div>
     <div class="phone-body">${mine.map(t=>{const gs=guestsOf(t);return `
       <div class="g-card"><h3>${esc(t.name)}</h3><div class="mono muted" style="font-size:12px">${range(t)}・${paxOf(t)}名</div>
         ${t.it.map((d,i)=>`<div class="day"><b>${i+1}日目</b><ol>${d.map(x=>`<li><span class="mono">${x[0]}</span><span>${esc(x[1])}</span></li>`).join("")}</ol></div>`).join("")}
         ${t.hotels.length?`<div class="gp">宿：${t.hotels.map(h=>esc(h.n)).join("／")}</div>`:""}
         ${gs.map(g=>`<div class="gp"><b>${esc(g.name)}</b>（${g.pax}名・${esc(g.country)}）<div class="mono muted" style="font-size:12px">緊急連絡 ${esc(g.phone)}</div>${g.ai.requests.map(r=>`<div class="need">● ${esc(r.t)}</div>`).join("")}</div>`).join("")}
         ${t.ext?`<div class="gp muted">ほか ${t.ext}名</div>`:""}
       </div>`}).join("")||'<div class="empty">担当ツアーはありません</div>'}
     </div>
   </div>
   <div class="explain"><h3>ガイドに見せる情報だけを出す</h3>
     <p>ガイドの ID でログインすると、この画面だけが開きます。上の「ログイン中」を「田中（ガイド）」に切り替えると、ほかの画面が閉じることを確認できます。</p>
     <ul>
       <li>表示するもの：担当ツアーの行程・宿・参加ゲストの氏名・人数・緊急連絡先・食事や体調の注意事項</li>
       <li>表示しないもの：メール本文・入金状況・他ガイドの担当ツアー・問い合わせ段階のゲスト</li>
       <li>注意事項はメールからAIが抽出した「要望・特記事項」がそのまま入るため、転記の手間と漏れがなくなります</li>
     </ul></div>
  </div>`;
}

/* ---------- 描画と操作 ---------- */
function allowed(view){const r=me().role;if(r==="guide")return view==="guide";return true}
function render(){
  if(!allowed(S.view))S.view="guide";
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    const v=b.dataset.view;b.hidden=!allowed(v);
    b.setAttribute("aria-current",v===S.view?"page":"false");
    if(v==="inbox"){const n=GUESTS.filter(g=>unanswered(g)&&!g.handler).length;b.innerHTML=`共通メール${n?`<span class="cnt">${n}</span>`:""}`}
  });
  const app=document.getElementById("app");
  app.innerHTML = S.view==="guests"?viewGuests():S.view==="tours"?viewTours():S.view==="inbox"?viewInbox():viewGuide();
  try{const h=S.view==="guests"?S.guest:S.view==="tours"?S.tour:S.view;history.replaceState(null,"","#"+h)}catch(e){}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.view){S.view=b.dataset.view;S.flashMail=null;render();return}
  if(b.dataset.guest){S.guest=b.dataset.guest;S.view="guests";S.flashMail=null;render();window.scrollTo({top:0});return}
  if(b.dataset.tour){S.tour=b.dataset.tour;S.view="tours";render();window.scrollTo({top:0});return}
  if(b.dataset.src){S.flashMail=b.dataset.src;render();const el=document.getElementById("mail-"+b.dataset.src);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});return}
  const g=guestById(S.guest);const act=b.dataset.act;if(!act||!g)return;
  const u=me();
  if(act==="claim"||act==="takeover"){g.handler=u.name;g.state="対応中";render();toast(`${u.name}さんの担当にしました。ほかのスタッフには「対応中」と表示されます`)}
  else if(act==="release"){g.handler=null;g.state=unanswered(g)?"未対応":"返信済";render();toast("担当を外しました")}
  else if(act==="draft"){document.getElementById("reply").value=g.draft;toast("未対応事項に答える下書きを入れました。内容を確認してから送信してください")}
  else if(act==="send"){
    const v=document.getElementById("reply").value.trim();
    if(!v){toast("返信文が空です。本文を入力してください");return}
    const last=lastIn(g);
    g.emails.push({id:"m"+Date.now(),dir:"out",at:`${TODAY} 12:00`,subj:"Re: "+last.subj.replace(/^Re: /,""),body:v+"\n\n— "+u.name});
    g.ai.todos.forEach(t=>{if(t.src===last.id)t.done=true});
    g.state="返信済";g.handler=null;S.flashMail=null;render();toast("履歴に追加しました（デモのため実際には送信していません）");
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="role"){S.user=e.target.value;if(me().role==="guide")S.view="guide";render();toast(`${me().name}（${me().label}）でログインしました`)}
  if(e.target.id==="tf"){S.tourFilter=e.target.value;render()}
  if(e.target.dataset&&e.target.dataset.todo!==undefined){const g=guestById(S.guest);g.ai.todos[+e.target.dataset.todo].done=e.target.checked;render()}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("q");q.focus();q.setSelectionRange(pos,pos)}});
(function init(){
  const h=(location.hash||"").slice(1);
  if(guestById(h)){S.view="guests";S.guest=h}
  else if(tourById(h)){S.view="tours";S.tour=h}
  else if(["guests","tours","inbox","guide"].includes(h))S.view=h;
  render();
})();
</script>
